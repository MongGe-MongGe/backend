# =========================================================
# 외부 설정 파일 import
# =========================================================
# application-local.properties 파일이 있으면 추가로 읽어온다.
# optional: 이 붙어 있어서 해당 파일이 없어도 에러가 나지 않는다.
# 
# 협업할 때 DB 계정/비밀번호/API 키처럼 사람마다 다른 값은
# application-local.properties에 따로 두고 Git에는 올리지 않는 방식으로 사용한다.
spring.config.import=optional:classpath:application-local.properties


# =========================================================
# Logging 설정
# =========================================================
# com.ssafy 패키지 하위 로그 레벨을 trace로 설정한다.
# trace는 가장 상세한 로그 레벨이다.
# 
# 로그 레벨 순서:
# trace > debug > info > warn > error
#
# 개발 중에는 trace/debug가 유용하지만,
# 너무 많은 로그가 찍힐 수 있어서 배포 환경에서는 info 이상을 주로 사용한다.
logging.level.com.ssafy=trace

# 콘솔에 출력되는 로그 형식을 지정한다.
# %d{HH:mm:ss}  : 시간
# [%level]      : 로그 레벨
# %c{36}        : 로거 이름, 보통 클래스명. 36자 제한
# %m            : 로그 메시지
# %n            : 줄바꿈
logging.pattern.console=%d{HH:mm:ss} [%level] %c{36} %m%n


# =========================================================
# File Upload 설정
# =========================================================
# 파일 업로드 기능을 사용할 경우 유지한다.
# 이미지/첨부파일 업로드 기능이 없다면 아래 multipart 설정은 지워도 된다.

# 업로드된 파일이 임시로 저장될 위치
# ${user.home}은 현재 OS 사용자 홈 디렉토리를 의미한다.
# 예: Windows에서는 C:/Users/사용자명/uploads
spring.servlet.multipart.location=${user.home}/uploads

# 업로드 파일이 이 크기를 넘으면 메모리가 아니라 디스크에 임시 저장된다.
# 10MB 이하는 메모리에서 처리하고, 초과하면 디스크에 저장하는 식으로 동작한다.
spring.servlet.multipart.file-size-threshold=10MB

# 파일 1개당 최대 업로드 크기
spring.servlet.multipart.max-file-size=10MB

# 한 번의 요청에서 업로드 가능한 전체 파일 크기
# 여러 파일을 동시에 올릴 경우 전체 합산 크기 제한이다.
spring.servlet.multipart.max-request-size=50MB


# =========================================================
# Datasource 공통 설정
# =========================================================
# MySQL JDBC Driver 클래스명
# MySQL 8 이상에서는 com.mysql.cj.jdbc.Driver를 사용한다.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# HikariCP 커넥션 풀 설정
# =========================================================
# Spring Boot의 기본 커넥션 풀은 HikariCP다.
# DB 연결을 매번 새로 만들면 느리기 때문에,
# 미리 여러 개의 DB 연결을 만들어두고 재사용한다.

# 사용하지 않는 커넥션을 풀에 유지할 수 있는 최대 시간
# 300000ms = 5분
spring.datasource.hikari.idle-timeout=300000

# 커넥션 풀에서 최소로 유지할 유휴 커넥션 수
# 트래픽이 적어도 최소 3개는 유지한다.
spring.datasource.hikari.minimum-idle=3

# 커넥션 풀에서 만들 수 있는 최대 커넥션 수
# 동시에 DB 연결을 최대 5개까지 사용한다.
# 개발/소규모 프로젝트에서는 5 정도면 충분하다.
spring.datasource.hikari.maximum-pool-size=5

# DB 연결을 얻기 위해 기다리는 최대 시간
# 600000ms = 10분
# 보통은 너무 긴 편이라, 실무에서는 30000ms 정도도 많이 쓴다.
spring.datasource.hikari.connection-timeout=600000

# MySQL JDBC 드라이버의 SQL 프로파일링 옵션
# true로 하면 실행 SQL 관련 로그가 더 자세히 찍힐 수 있다.
# 개발 중 디버깅에는 도움이 되지만 로그가 많아질 수 있다.
spring.datasource.hikari.data-source-properties.profileSQL=true


# =========================================================
# MyBatis 설정
# =========================================================
# Mapper XML에서 resultType, parameterType 등에 패키지명을 전부 쓰지 않고
# 클래스명만 쓸 수 있게 해주는 type alias 설정이다.
#
# 예:
# resultType="com.ssafy.gourming.domain.member.dto.MemberDto"
# 대신
# resultType="MemberDto"
# 처럼 사용할 수 있다.
#
# 프로젝트 패키지 구조에 맞게 수정해야 한다.
mybatis.type-aliases-package=com.ssafy.gourming.model.dto
mybatis.type-handlers-package=com.ssafy.gourming.typehandler

# MyBatis Mapper XML 파일 위치
# classpath:/mappers/**/*.xml 은
# src/main/resources/mappers 하위의 모든 XML 파일을 읽는다는 뜻이다.
#
# 예:
# src/main/resources/mappers/member/MemberMapper.xml
# src/main/resources/mappers/restaurant/RestaurantMapper.xml
mybatis.mapper-locations=classpath:/mappers/**/*.xml

# DB 컬럼명과 Java 필드명을 자동으로 매핑해준다.
# DB: created_at
# Java: createdAt
#
# 이 옵션을 켜면 snake_case 컬럼을 camelCase 필드에 자동 매핑할 수 있어서 편하다.
mybatis.configuration.map-underscore-to-camel-case=true


# =========================================================
# Place Review Summary AI 설정
# =========================================================
# 기본값은 false로 두어 API 키가 없는 로컬/테스트 환경에서도 Fake 요약기를 사용한다.
# 실제 AI 연동을 사용할 환경에서는 application-local.properties 또는 환경변수로 true를 지정한다.
place-summary.ai.enabled=false
place-summary.ai.provider=openai
place-summary.ai.model=${PLACE_SUMMARY_AI_MODEL:gpt-5-mini}
place-summary.ai.api-key=${PLACE_SUMMARY_AI_API_KEY:${GMS_KEY:}}
place-summary.ai.base-url=${PLACE_SUMMARY_AI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com}
place-summary.ai.timeout-seconds=20
place-summary.ai.max-review-count=50
# File Upload Directory
# 프로젝트 루트(backend 폴더) 기준으로 상대경로가 생성됩니다.
file.upload.dir=uploads/images/
